backend:
  name: git-gateway
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  - name: "blog"
    label: "Blog Artikel"
    folder: "content/blog"
    create: true
    fields:
      - {label: "Judul", name: "title", widget: "string"}
      - {label: "Tanggal", name: "date", widget: "datetime"}
      - {label: "Gambar Utama", name: "image", widget: "image"}
      - {label: "Isi Konten", name: "body", widget: "markdown"}

  - name: "tours"
    label: "Paket Tur"
    folder: "content/tours"
    create: true
    fields:
      - {label: "Nama Paket Tur", name: "title", widget: "string"}
      - {label: "Durasi", name: "duration", widget: "string", default: "10 Jam"}
      - {label: "Harga (Contoh: Rp 650.000)", name: "price", widget: "string"}
      - {label: "Lokasi / Rute", name: "location", widget: "string"}
      - {label: "Gambar Tur", name: "image", widget: "image"}
      - {label: "Deskripsi Singkat", name: "description", widget: "text"}

  - name: "settings"
    label: "Pengaturan Kontak & Umum"
    files:
      - file: "content/settings.json"
        name: "general"
        label: "Informasi Kontak"
        fields:
          - {label: "Nomor WhatsApp (Format: 628xxxx)", name: "whatsapp", widget: "string"}
          - {label: "Alamat Email", name: "email", widget: "string"}
          - {label: "Alamat Kantor / Lokasi", name: "address", widget: "string"}
          - {label: "Jam Operasional", name: "hours", widget: "string"}
  - name: "homepage"
    label: "Pengaturan Beranda"
    files:
      - file: "content/homepage.json"
        name: "home"
        label: "Konten Beranda"
        fields:
          - {label: "Badge / Label Atas", name: "badge", widget: "string", default: "Trusted Private Tour in Bali"}
          - {label: "Judul Utama (Heading)", name: "title", widget: "string", default: "Jelajahi Pesona Bali Sesuai Gaya Anda"}
          - {label: "Deskripsi Singkat", name: "description", widget: "text", default: "Nikmati tur seharian privat yang fleksibel, mobil nyaman ber-AC, supir berpengalaman, dan pengalaman liburan tanpa repot."}
          - {label: "Teks Tombol Kiri", name: "btnText1", widget: "string", default: "Lihat Paket Tur"}
          - {label: "Teks Tombol Kanan", name: "btnText2", widget: "string", default: "Rancang Custom Tour"}
collections:
  - name: "tours"
    label: "Paket Tur"
    folder: "content/tours"
    create: true
    fields:
      - {label: "Nama Paket Tur", name: "title", widget: "string"}
      - {label: "Durasi (Contoh: 10 Jam)", name: "duration", widget: "string", default: "10 Jam"}
      - {label: "Harga (Contoh: Rp 650.000)", name: "price", widget: "string"}
      - {label: "Rute / Lokasi", name: "location", widget: "string"}
      - {label: "Gambar Tur", name: "image", widget: "image"}
      - {label: "Deskripsi Singkat", name: "description", widget: "text"}
